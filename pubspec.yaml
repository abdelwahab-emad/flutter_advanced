name: flutter_complete_project
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # State Management & Dependency Injection
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

  # Annotations for Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.11.1
  retrofit: ^4.10.0
  pretty_dio_logger: ^1.4.0

  # Localization
  easy_localization: ^3.0.8
  intl: 0.20.2

  # Splash Screen & Assets
  flutter_native_splash: ^2.4.4
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation Tools
  build_runner: ^2.4.15
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  retrofit_generator: ^10.0.0

dependency_overrides:
  intl: 0.20.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/